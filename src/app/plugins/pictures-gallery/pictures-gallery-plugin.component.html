<div class="pictures-gallery-container"
     #galleryContainer
     (scroll)="onScroll()"
     [style.min-height.px]="pluginConfiguration?.data?.height || 300">
    <div class="gallery-thumbs">
        <div *ngFor="let picture of images; let i = index"
             class="gallery-thumb"
             [class.active]="i === currentItemIndex"
             [style.width.px]="pluginConfiguration?.data?.thumbSize || 70"
             [style.height.px]="pluginConfiguration?.data?.thumbSize || 70"
             (click)="onImageClick(i)"
             (keydown.enter)="onImageClick(i)"
             role="button"
             tabindex="0">
            <img [attr.data-src]="picture.thumbPath"
                 [attr.alt]="picture.name"
                 [attr.title]="picture.name"
                 loading="lazy" />
        </div>
    </div>
</div>
